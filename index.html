<html lang="zh-HK">
<head>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>

</head>
<body class="bg-orange-50/30 text-slate-800 font-sans">

    <!-- 登入頁面 -->
    <div id="login-overlay" class="fixed inset-0 bg-orange-500 flex flex-col justify-center items-center z-50 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <img src="Logo-title.png" alt="香港社區言語治療中心" 
                 onclick="openLink('https://www.speech.com.hk/', event)"
                 class="h-24 mx-auto mb-4 object-contain cursor-pointer hover:scale-105 transition-transform duration-200">
            <p class="text-slate-500 text-sm mb-6">請輸入您的家長專屬密碼</p>
            
            <input type="password" id="password-input" placeholder="請輸入密碼" 
                   onkeydown="if(event.key === 'Enter') checkPassword()"
                   class="w-full px-4 py-3 border border-orange-200 rounded-xl mb-4 text-center focus:outline-none focus:ring-2 focus:ring-orange-500 tracking-widest">
            
            <button onclick="checkPassword()" 
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-3 rounded-xl transition shadow-md">
                進入專屬教材庫
            </button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">❌ 請輸入密碼</p>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-content" class="hidden">
        
        <div id="announcement-banner" class="hidden bg-red-500 text-white text-center py-2 px-4 text-sm font-medium shadow-sm">
            <span id="announcement-text"></span>
        </div>

        <header class="bg-white text-slate-800 p-6 shadow-sm border-b border-orange-100 flex flex-col items-center justify-center relative">
            <img src="Logo-title.png" alt="香港社區言語治療中心" 
                 onclick="openLink('https://www.speech.com.hk/', event)"
                 class="h-20 w-auto object-contain cursor-pointer hover:scale-105 transition-transform duration-200">
            <p class="text-xs mt-2 font-medium text-orange-600">家長資源網 · 陪小朋友在家輕鬆練習</p>
            
            <div id="user-profile-section" class="hidden absolute top-4 right-4 bg-orange-50 border border-orange-200 rounded-full px-4 py-1.5 shadow-sm flex items-center gap-2">
                <span class="text-sm font-bold text-slate-700">👋 <span id="student-name-display"></span></span>
                <span class="text-sm font-bold text-orange-500 text-lg transition-transform duration-300" id="star-icon">⭐</span>
                <span class="text-sm font-bold text-orange-600" id="student-stars-display"></span>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-6">
            
            <!-- 廣告區 -->
            <section class="mb-8 mt-2">
                <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-2xl p-6 text-white shadow-md relative overflow-hidden">
                    <div class="absolute -right-6 -top-6 w-32 h-32 bg-white opacity-10 rounded-full"></div>
                    <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white opacity-10 rounded-full"></div>
                    
                    <div class="relative z-10">
                        <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block">✨ 最新推介</span>
                        <h2 class="text-xl font-bold mb-2">🗣️ 2026 小一開學適應小組</h2>
                        <p class="text-sm text-orange-50 mb-4 leading-relaxed">現正接受報名！開學優惠$800/4堂。適合小一學童，透過小組活動加強語言、社交、讀寫能力，盡早適應小一生活，名額有限！</p>
                        
                        <button onclick="openLink('https://wa.me/85212345678?text=你好，我想查詢關於【秋季社交小組】的詳情！', event)" 
                                class="bg-white text-orange-600 font-bold text-sm px-5 py-2.5 rounded-xl shadow-sm hover:bg-orange-50 hover:scale-105 transition duration-200 inline-flex items-center gap-2">
                            <svg class="w-5 h-5 fill-current text-green-500" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                            </svg>
                            WhatsApp 查詢及報名
                        </button>
                    </div>
                </div>
            </section>

            <!-- 儀表板區 -->
            <section id="progress-dashboard" class="mb-6 hidden">
                <h2 class="text-lg font-semibold mb-3 text-orange-700">🎯 本月專屬訓練里程碑</h2>
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-orange-100" id="progress-bars-container">
                </div>
            </section>

            <!-- 搜尋及分類區 -->
            <section class="mb-6">
                <div class="relative max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                    <input type="text" id="search-input" oninput="applyFilterAndSearch()"
                           placeholder="輸入關鍵字搜尋教材（如：工作紙、S音）..." 
                           class="w-full pl-10 pr-4 py-3 bg-white border border-orange-200 rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition">
                </div>
            </section>
            
            <section class="mb-8">
                <h2 class="text-lg font-semibold mb-3 text-orange-700">📌 教材分類</h2>
                <div class="flex flex-wrap gap-3" id="filter-buttons">
                    <button onclick="changeCategory('all', this)" class="bg-orange-500 text-white px-4 py-2 rounded-full font-medium shadow-sm transition">所有教材</button>
                    <button onclick="changeCategory('babble', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">牙牙學語</button>
                    <button onclick="changeCategory('sentence', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">句子建構</button>
                    <button onclick="changeCategory('story', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">故事敘述</button>
                    <button onclick="changeCategory('pronounce', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">發音訓練</button>
                    <button onclick="changeCategory('social', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">社交訓練</button>
                    <button onclick="changeCategory('game', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">有趣遊戲</button>
                    <button onclick="changeCategory('others', this)" class="bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition">其他教材</button>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-semibold mb-4 text-orange-700">📚 您的專屬教材</h2>
                
                <div id="loading-spinner" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-orange-500 border-t-transparent mb-2"></div>
                    <p class="text-slate-400 text-sm">正在核對密碼並載入專屬教材...</p>
                </div>

                <p id="no-results" class="text-slate-400 text-sm italic py-8 text-center hidden">❌ 找不到符合條件的教材，請試試其他關鍵字。</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="materials-grid">
                </div>
            </section>

        </main>
    </div>

    <footer class="text-center text-slate-400 text-xs my-12">
        &copy; 2026 香港社區言語治療中心. 版權所有.
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>

    <script>
        const AIRTABLE_BASE_ID = 'appavmqgjBcW6umdd';
        const AIRTABLE_TABLE_NAME = 'Table 1';
        const AIRTABLE_TOKEN = 'pat98TaonLaIXB1L9.8ccdee0d106bc0bda7fa4d987c5ef8b8a1623e0fd3df143fe89069eaa8d2d98b';

        let myMaterials = []; 
        let currentCategory = 'all';
        let currentUserRecordIds = []; 
        let currentStars = 0;

        function openLink(url, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            if (!url || url === '#') return;
            
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function checkPassword() {
            const userInput = document.getElementById('password-input').value.trim();
            if (!userInput) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.innerText = "❌ 請先輸入密碼";
                errorMsg.classList.remove('hidden');
                return;
            }

            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('loading-spinner').classList.remove('hidden');
            
            fetchAnnouncements();
            fetchDataFromAirtable(userInput); 
        }

        function fetchAnnouncements() {
            const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Announcements`;
            fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } })
            .then(res => res.json())
            .then(data => {
                if (data.records && data.records.length > 0) {
                    const firstMsg = data.records[0].fields.message;
                    if (firstMsg) {
                        document.getElementById('announcement-text').innerText = "📢 " + firstMsg;
                        document.getElementById('announcement-banner').classList.remove('hidden');
                    }
                }
            }).catch(e => console.log('未設定通告表，略過顯示'));
        }

        function logLoginToAirtable(studentName) {
            const logUrl = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Login_Log`;
            const now = new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' });
            const payload = { records: [{ fields: { student_name: studentName, login_time: now } }] };

            fetch(logUrl, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('無設定 Log 表，略過紀錄'));
        }

        function fetchDataFromAirtable(userPassword) {
            let filterFormula = `{password} = '${userPassword}'`;
            if (userPassword === 'admin2026') filterFormula = "NOT({title} = '')"; 

            const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}?filterByFormula=${encodeURIComponent(filterFormula)}`;
            
            fetch(url, { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } })
            .then(response => {
                if (!response.ok) throw new Error("HTTP 狀態碼: " + response.status);
                return response.json();
            })
            .then(data => {
                // 🔥 加入 Try-Catch 偵測畫面載入錯誤
                try {
                    if (!data.records || data.records.length === 0) {
                        alert("❌ 密碼不正確，或目前未有您的專屬教材，請聯絡治療師。");
                        location.reload(); 
                        return;
                    }

                    currentUserRecordIds = data.records.map(r => r.id);
                    currentStars = data.records[0].fields.stars || 0;

                    const firstRecord = data.records[0].fields;
                    if (firstRecord.student_name) {
                        document.getElementById('student-name-display').innerText = firstRecord.student_name;
                        document.getElementById('student-stars-display').innerText = currentStars;
                        document.getElementById('user-profile-section').classList.remove('hidden');
                        logLoginToAirtable(firstRecord.student_name);
                    }

                    const progressContainer = document.getElementById('progress-bars-container');
                    const progressDashboard = document.getElementById('progress-dashboard');
                    let progressHTML = '';
                    
                    let foundGoal1Name = '', foundGoal1Progress = 0;
                    let foundGoal2Name = '', foundGoal2Progress = 0;
                    
                    for (let record of data.records) {
                        if (!foundGoal1Name && record.fields.goal_1_name) {
                            foundGoal1Name = record.fields.goal_1_name;
                            foundGoal1Progress = record.fields.goal_1_progress || 0;
                        }
                        if (!foundGoal2Name && record.fields.goal_2_name) {
                            foundGoal2Name = record.fields.goal_2_name;
                            foundGoal2Progress = record.fields.goal_2_progress || 0;
                        }
                    }

                    function generateProgressBar(name, progress) {
                        let p = Math.min(Math.max(progress || 0, 0), 100); 
                        let isComplete = p >= 100;
                        let barColor = isComplete ? 'bg-green-500' : 'bg-orange-500';
                        let statusText = isComplete ? '⭐ 已達標' : `${p}%`;
                        
                        return `
                        <div class="mb-5 last:mb-0">
                            <div class="flex justify-between items-end mb-2">
                                <span class="text-sm font-bold text-slate-700">${name}</span>
                                <span class="text-xs font-bold ${isComplete ? 'text-green-600' : 'text-orange-600'}">${statusText}</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 shadow-inner">
                                <div class="${barColor} h-2.5 rounded-full transition-all duration-1000 ease-out" style="width: ${p}%"></div>
                            </div>
                        </div>`;
                    }

                    if (foundGoal1Name) progressHTML += generateProgressBar(foundGoal1Name, foundGoal1Progress);
                    if (foundGoal2Name) progressHTML += generateProgressBar(foundGoal2Name, foundGoal2Progress);

                    if (progressHTML !== '') {
                        progressContainer.innerHTML = progressHTML;
                        progressDashboard.classList.remove('hidden');
                    } else {
                        progressDashboard.classList.add('hidden');
                    }

                    myMaterials = data.records.map(record => {
                        const fields = record.fields;
                        let badgeColor = "bg-orange-100 text-orange-800";
                        if (fields.category === 'babble') badgeColor = "bg-amber-100 text-amber-800";
                        if (fields.category === 'story') badgeColor = "bg-yellow-100 text-yellow-800";
                        if (fields.category === 'pronounce') badgeColor = "bg-red-100 text-red-800";
                        if (fields.category === 'social') badgeColor = "bg-purple-100 text-purple-800";
                        if (fields.category === 'game') badgeColor = "bg-pink-100 text-pink-800";
                        if (fields.category === 'others') badgeColor = "bg-slate-200 text-slate-800";

                        return {
                            id: record.id,
                            title: fields.title || '未命名教材',
                            category: fields.category || 'sentence',
                            categoryName: fields.categoryName || '句子建構',
                            description: fields.description || '暫無簡介。',
                            link: fields.link || '#',
                            badgeColor: badgeColor,
                            youtubeLink: fields.youtube_link || '', 
                            feedbackLink: fields.feedback_link || '' 
                        };
                    });

                    document.getElementById('loading-spinner').classList.add('hidden');
                    renderMaterials();
                    
                } catch (renderError) {
                    // 如果係代碼出錯，會直接顯示喺畫面度！
                    document.getElementById('loading-spinner').innerHTML = `<p class="text-red-600 font-bold p-4 bg-red-50 rounded-xl">❌ 系統繪製錯誤：<br>${renderError.message}</p>`;
                    console.error(renderError);
                }
            })
            .catch(error => {
                // 如果係網絡或 API 出錯，會連埋死因印出嚟！
                document.getElementById('loading-spinner').innerHTML = `<p class="text-red-600 font-bold p-4 bg-red-50 rounded-xl">❌ 連線失敗<br>原因：${error.message}<br><span class="text-xs font-normal text-slate-500">請檢查 Wi-Fi 或 Airtable 欄位。</span></p>`;
            });
        }

        function claimStar(btnElement) {
            event.stopPropagation();
            currentStars += 1;
            document.getElementById('student-stars-display').innerText = currentStars;
            
            const starIcon = document.getElementById('star-icon');
            starIcon.classList.add('scale-150');
            setTimeout(() => starIcon.classList.remove('scale-150'), 300);

            btnElement.disabled = true;
            btnElement.innerText = "✅ 已領取";
            btnElement.classList.replace('bg-yellow-400', 'bg-slate-100');
            btnElement.classList.replace('hover:bg-yellow-500', 'text-slate-400');
            btnElement.classList.replace('text-white', 'text-slate-400');
            btnElement.classList.remove('shadow-sm', 'border-yellow-400');
            btnElement.classList.add('border', 'border-slate-200', 'cursor-not-allowed');

            updateStarsInAirtable(currentStars);
        }

        function updateStarsInAirtable(newStars) {
            const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`;
            for (let i = 0; i < currentUserRecordIds.length; i += 10) {
                const chunk = currentUserRecordIds.slice(i, i + 10);
                const payload = {
                    records: chunk.map(id => ({ id: id, fields: { stars: newStars } }))
                };
                fetch(url, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(err => console.error('星星更新失敗:', err));
            }
        }

        function renderMaterials() {
            const grid = document.getElementById('materials-grid');
            grid.innerHTML = myMaterials.map(item => {
                
                let feedbackBtn = item.feedbackLink ? `<button onclick="openLink('${item.feedbackLink}', event)" class="bg-green-50 text-green-600 hover:bg-green-100 border border-green-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition mt-2 mr-2 inline-block shadow-sm">📤 交功課</button>` : '';
                let starBtn = `<button onclick="claimStar(this)" class="bg-yellow-400 hover:bg-yellow-500 text-white border border-yellow-400 text-xs font-semibold px-3 py-1.5 rounded-lg transition mt-2 inline-block shadow-sm">🌟 完成！領取星星</button>`;

                let hasVideo = item.youtubeLink && item.youtubeLink.trim() !== '';
                let hasFile = item.link && item.link.trim() !== '' && item.link !== '#';

                let clickAction, btnClass, btnText, typeLabel, cursorClass;

                if (hasVideo) {
                    clickAction = `openLink('${item.youtubeLink}', event)`;
                    btnClass = "bg-red-500 hover:bg-red-600 text-white";
                    btnText = "▶️ 觀看影片";
                    typeLabel = "教學影片";
                    cursorClass = "cursor-pointer hover:scale-[1.01]";
                } else if (hasFile) {
                    clickAction = `openLink('${item.link}', event)`;
                    btnClass = "bg-orange-500 hover:bg-orange-600 text-white";
                    btnText = "下載教材";
                    typeLabel = "教材文件";
                    cursorClass = "cursor-pointer hover:scale-[1.01]";
                } else {
                    clickAction = `event.stopPropagation(); alert('⚠️ 治療師尚未上載此教材！');`;
                    btnClass = "bg-gray-200 text-gray-500 cursor-not-allowed";
                    btnText = "準備中";
                    typeLabel = "教材內容";
                    cursorClass = "";
                }

                return `
                <div onclick="${clickAction}" 
                     class="material-card bg-white rounded-xl shadow-sm p-5 border border-orange-100 flex flex-col justify-between ${cursorClass} transform transition duration-200" 
                     data-category="${item.category}">
                    <div>
                        <span class="${item.badgeColor} text-xs font-semibold px-2.5 py-1 rounded">${item.categoryName}</span>
                        <h3 class="text-lg font-bold mt-2 text-slate-800">${item.title}</h3>
                        <p class="text-slate-500 text-sm mt-1 text-justify mb-2">${item.description}</p>
                        <div class="flex flex-wrap items-center">
                            ${feedbackBtn}
                            ${starBtn}
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between items-center pt-3 border-t border-slate-50">
                        <span class="text-xs text-slate-400">${typeLabel}</span>
                        <button class="${btnClass} text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">${btnText}</button>
                    </div>
                </div>
            `}).join('');
            
            applyFilterAndSearch();
        }

        function changeCategory(category, buttonElement) {
            currentCategory = category;
            const buttons = document.querySelectorAll('#filter-buttons button');
            buttons.forEach(btn => {
                btn.className = "bg-white hover:bg-orange-50 text-slate-600 px-4 py-2 rounded-full font-medium border border-orange-200 transition";
            });
            buttonElement.className = "bg-orange-500 text-white px-4 py-2 rounded-full font-medium shadow-sm transition";
            applyFilterAndSearch();
        }

        function applyFilterAndSearch() {
            const searchText = document.getElementById('search-input').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.material-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                const titleText = card.querySelector('h3').innerText.toLowerCase();
                const descText = card.querySelector('p').innerText.toLowerCase();

                const matchCategory = (currentCategory === 'all' || cardCategory === currentCategory);
                const matchSearch = (titleText.includes(searchText) || descText.includes(searchText));

                if (matchCategory && matchSearch) {
                    card.classList.remove('hidden');
                    visibleCount++;
                } else {
                    card.classList.add('hidden');
                }
            });

            const noResultsMsg = document.getElementById('no-results');
            if (visibleCount === 0 && myMaterials.length > 0) {
                noResultsMsg.classList.remove('hidden');
            } else {
                noResultsMsg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
